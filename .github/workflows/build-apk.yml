name: Build StreamHub APK

# StreamHub: own workflow, no upstream secrets. Builds the release APK
# (unsigned) and uploads it as an artifact. The APK is signed locally
# after download.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: streamhub-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
